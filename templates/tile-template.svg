<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="32"
  height="32"
  viewBox="0 0 32 32"
>
  <!--
    Pictiq tile template (canonical working file)

    Authoring notes:
    - The tile frame is part of the icon (do not remove / do not edit geometry).
    - Draw the pictogram in the 'content' layer using fill/stroke="currentColor".
    - Guides are included but hidden by default (display="none").
  -->

  <!-- Frame (canonical) -->
  <!-- Default geometry for 32x32: corner radius 4, stroke 2, safe padding ~3 -->
  <g
    id="frame"
    inkscape:groupmode="layer"
    inkscape:label="frame"
  >
    <rect
      x="1"
      y="1"
      width="30"
      height="30"
      rx="4"
      ry="4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      vector-effect="non-scaling-stroke"
    />
  </g>

  <!-- Content (draw your silhouette here) -->
  <g
    id="content"
    inkscape:groupmode="layer"
    inkscape:label="content"
  >
    <!-- Insert icon artwork here. Prefer fill/stroke="currentColor". -->
  </g>

  <!-- Guides (hidden by default; enable for editing) -->
  <g id="guides" style="display:none" inkscape:label="guides">
    <!-- Safe area (recommended): keep artwork inside this inner box -->
    <rect
      x="4"
      y="4"
      width="24"
      height="24"
      rx="2"
      ry="2"
      fill="none"
      stroke="#00ff99"
      stroke-width="0.5"
      stroke-dasharray="1 1"
    />

    <!-- Centering guides -->
    <line x1="16" y1="2" x2="16" y2="30" stroke="#00ff99" stroke-width="0.5" stroke-dasharray="1 1" />
    <line x1="2" y1="16" x2="30" y2="16" stroke="#00ff99" stroke-width="0.5" stroke-dasharray="1 1" />

    <!-- Baseline grid (optional) -->
    <rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="#00ff99" stroke-width="0.25" opacity="0.6" />
  </g>
</svg>

