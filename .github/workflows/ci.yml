name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate lexicon and packs
        run: python tools/validate_lexicon.py
      - name: Validate vocabulary profiles
        run: python tools/validate_profiles.py
      - name: Validate vocabulary classification
        run: python tools/validate_vocabulary_classification.py
      - name: Validate numeric notation
        run: python tools/validate_numeric_notation.py
      - name: Validate compatibility migrations
        run: python tools/validate_compatibility.py
      - name: Validate Pictiq message schema fixtures
        run: python tools/validate_message_schema.py
      - name: Validate SVG icons
        if: ${{ hashFiles('icons/svg/*.svg') != '' }}
        run: python tools/validate_svg.py
      - name: Validate entity symbols
        run: python tools/validate_entities.py
      - name: Validate Pages artifact
        run: python tools/validate_pages_artifact.py
      - name: Test visual QA evidence tooling
        run: python -m unittest discover -s tests -v
