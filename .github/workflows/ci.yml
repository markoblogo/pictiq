name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate lexicon and packs
        run: python tools/validate_lexicon.py
      - name: Validate SVG icons
        if: ${{ hashFiles('icons/svg/*.svg') != '' }}
        run: python tools/validate_svg.py
